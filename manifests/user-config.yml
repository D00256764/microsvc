apiVersion: v1
kind: ConfigMap
metadata:
  name: users-config
data:
  redis_host: "users-db"
  redis_port: "6379"
  service_port: "5000"
  redis.conf: |
    daemonize no
    requirepass password
    pidfile /data/redis.pid
    bind 0.0.0.0
    port 6379
    timeout 3600
    tcp-keepalive 60
    logfile ""
    dbfilename dump.rdb
    dir /data
    appendonly yes
    save 900 1
    save 300 10
    save 60 10000
    maxclients 10000