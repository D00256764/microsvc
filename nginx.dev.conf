# Dev-only nginx config: redirects root to the upload UI and proxies services for compose
user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 100M;
    
    server {
        listen 80;
        server_name localhost;

        # dev: redirect root to the upload UI
        location = / {
            return 302 /upload-song;
        }

        location /get-catalog {
            proxy_pass http://list-search:5000/get-catalog;
        }

        location /upload-song {
            proxy_pass http://upload-song:5000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_set_header X-NginX-Proxy true;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_max_temp_file_size 0;
            proxy_redirect off;
            proxy_read_timeout 5m;
        }

        location /get-song {
            proxy_pass http://play-song:5000/play-song;
        }

        location /songs {
            proxy_pass http://nginx:80/songs;
        }

        location /register {
            proxy_pass http://reg-login:5000/register;
        }

        location /login {
            proxy_pass http://reg-login:5000/login;
        }

        location /logout {
            proxy_pass http://reg-login:5000/logout;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}